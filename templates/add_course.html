
{% extends "base.html" %}

{% block title %}Add Course - TutorConnect{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card p-4 shadow-sm">

                <h2 class="fw-bold mb-4">Add a New Course</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Course Title</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               placeholder="e.g. Complete Mathematics for Class 10"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Describe what students will learn."
                                  required></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text"
                                   name="subject"
                                   class="form-control"
                                   placeholder="Mathematics"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Level</label>
                            <input type="text"
                                   name="level"
                                   class="form-control"
                                   placeholder="Class 10 / Beginner / Advanced"
                                   required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teaching Mode</label>
                        <select name="mode" class="form-select">
                            <option value="Online">Online</option>
                            <option value="Offline">Offline</option>
                            <option value="Online / Offline">Online / Offline</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course Duration</label>
                        <input type="text"
                               name="duration"
                               class="form-control"
                               placeholder="e.g. 3 months / 20 classes"
                               required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Course Price (₹)</label>
                        <input type="number"
                               name="price"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                    <button class="btn btn-primary w-100">
                        Submit Course for Approval
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>

{% endblock %}
```
